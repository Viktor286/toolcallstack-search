name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: toolcallstack_search
          POSTGRES_PASSWORD: toolcallstack_search
          POSTGRES_DB: toolcallstack_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toolcallstack_search"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          TEST_DATABASE_URL: postgres://toolcallstack_search:toolcallstack_search@localhost:5432/toolcallstack_search_test
      - run: pnpm build

  docker:
    # Both platforms the release publishes, each built on its own native runner, so an arm64-only
    # failure shows up in the pull request rather than when a tag is pushed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: toolcallstack-search:ci-${{ matrix.arch }}
          # Layers are cached per platform, so the two builds do not evict each other.
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,scope=ci-${{ matrix.arch }},mode=max
