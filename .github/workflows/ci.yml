name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: toolcallstack_search
          POSTGRES_PASSWORD: toolcallstack_search
          POSTGRES_DB: toolcallstack_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toolcallstack_search"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          TEST_DATABASE_URL: postgres://toolcallstack_search:toolcallstack_search@localhost:5432/toolcallstack_search_test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t toolcallstack-search .
